name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Bundle scrcpy server (Apache 2.0) used for stretched apps
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/foldspan-server.jar https://github.com/Genymobile/scrcpy/releases/download/v3.1/scrcpy-server-v3.1
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoldLink-apk
          path: app/build/outputs/apk/debug/app-debug.apk
